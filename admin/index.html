<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Blackthreads Blog Admin</title>
  <link rel="icon" type="image/png" href="../favicon-32x32.png">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; gap: 16px;
      background: #2b2b2b; color: #f5c518;
    }
    #loading h2 { font-size: 1.4rem; margin: 0; }
    #loading p { color: #888; font-size: 0.9rem; margin: 0; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #444;
      border-top-color: #f5c518; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>Blackthreads Blog Admin</h2>
    <p>Loading editor...</p>
  </div>

  <script>
    // Explicitly set config path before CMS loads
    // Handle OAuth callback from popup
    if (window.opener) {
      window.opener.postMessage(window.location.href, '*');
       window.close();
      }
      window.CMS_MANUAL_INIT = true;
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    window.addEventListener('load', () => {
      // Hide loading screen
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';

      // Manually initialize CMS with explicit config path
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'harishankarms-ux/blackthreadsweb',
            branch: 'main',
            base_url: 'https://api.netlify.com',
            site_id: '0a11f12f-d17b-407c-b7d2-4e3a65c3297a',
            site_domain: 'lovely-entremet-e829f1.netlify.app',
            auth_endpoint: 'auth',
            app_id: 'Ov23liXnqaSFQNZHb1l7'
          },
          media_folder: 'blog-images',
          public_folder: '/blog-images',
          collections: [
            {
              name: 'blog',
              label: 'Blog Posts',
              folder: 'blog-posts',
              create: true,
              slug: '{{slug}}',
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Publish Date', name: 'date', widget: 'datetime' },
                { label: 'Category', name: 'category', widget: 'select', options: ['Corporate Gifting', 'Apparel', 'Printing', 'Tech Gifts', 'Hampers', 'Trends', 'About Us'] },
                { label: 'Excerpt', name: 'excerpt', widget: 'text', hint: 'Short description shown on blog listing page (1-2 sentences)' },
                { label: 'Featured Image', name: 'image', widget: 'image', required: false },
                { label: 'Body', name: 'body', widget: 'markdown' },
                { label: 'SEO Description', name: 'seo_description', widget: 'text', required: false, hint: 'For Google search results — keep under 160 characters' },
                { label: 'Featured Post', name: 'featured', widget: 'boolean', default: false, hint: 'Show this post in the featured spot on blog page' }
              ]
            }
          ]
        }
      });
    });
  </script>
</body>
</html>
