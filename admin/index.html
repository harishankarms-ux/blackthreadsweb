<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Blackthreads Blog Admin</title>
</head>
<body>
  <script>
  // Redirect Netlify Identity invite/recovery tokens to admin
  if (window.location.hash) {
    var hash = window.location.hash;
    if (hash.includes('invite_token') || hash.includes('recovery_token') || hash.includes('confirmation_token')) {
      window.location.href = '/admin/' + hash;
    }
  }
</script>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
</body>
</html>
