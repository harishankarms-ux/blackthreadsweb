name: Update Blog Index

on:
  push:
    paths:
      - 'blog-posts/**.md'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate blog post index
        run: |
          cd blog-posts
          files=$(ls *.md 2>/dev/null | python3 -c "import sys,json; files=sys.stdin.read().strip().split('\n'); print(json.dumps([f for f in files if f]))")
          echo $files > index.json
          echo "Generated index.json with: $files"

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-posts/index.json
          git diff --staged --quiet || git commit -m "Auto-update blog index [skip ci]"
          git push
